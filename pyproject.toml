[project]
name = "squeegee"
version = "0.0.0"
description = "Observable cleaning and transforming of small data, for ad-hoc work during a normal development day"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Alex Shank", email = "ashank31@gmail.com" }]
keywords = ["data", "cleaning", "etl", "csv", "json", "pipeline"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Debuggers",
    "Typing :: Typed",
]
# no runtime dependencies, deliberately: see docs/decisions/0002-react-ui-on-a-stdlib-server.md
dependencies = []

[project.urls]
Homepage = "https://github.com/alexshank/squeegee"
Repository = "https://github.com/alexshank/squeegee"

# entry point stays commented out until squeegee/cli.py exists, so an install
# never advertises a command that cannot run
# [project.scripts]
# squeegee = "squeegee.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/squeegee"]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pre-commit>=3.8",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# ruff formats Python inside Markdown fences; documentation samples are written for
# reading rather than for the formatter, so they stay out of its way
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["A", "B", "C4", "D", "E", "F", "I", "N", "PTH", "RUF", "SIM", "UP"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# tests document themselves through their names
"tests/**" = ["D"]

[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
strict = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=squeegee --cov-report=term-missing --cov-fail-under=90 --strict-markers -q"

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:"]
